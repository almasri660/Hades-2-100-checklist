<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HADES II — 100% Completion Checklist</title>
<style>
  :root{
    --bg:#0e0b14; --panel:#171220; --panel2:#1e1729; --line:#3a2d4d;
    --text:#eee2f5; --dim:#a996bf; --accent:#c9a8ff; --gold:#e0b84f; --green:#7fd99b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:Georgia, 'Times New Roman', serif; background:
      radial-gradient(circle at 20% 0%, #241a33 0%, var(--bg) 55%);
    color:var(--text); padding:24px 14px 60px;
  }
  .wrap{max-width:900px;margin:0 auto;}
  h1{
    text-align:center; font-size:2.1em; letter-spacing:2px; margin:0 0 4px;
    color:var(--gold); text-shadow:0 0 18px rgba(224,184,79,0.35);
  }
  .subtitle{text-align:center;color:var(--dim);margin-bottom:22px;font-style:italic;}
  .total-bar{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:16px 18px; margin-bottom:26px; position:sticky; top:10px; z-index:5;
    box-shadow:0 6px 20px rgba(0,0,0,0.4);
  }
  .total-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .total-row .pct{font-size:1.6em;color:var(--gold);font-weight:bold;}
  .barbg{background:#2a2035;border-radius:6px;overflow:hidden;height:14px;border:1px solid var(--line);}
  .barfill{height:100%;background:linear-gradient(90deg,#7c5cff,var(--gold));transition:width .3s;}
  .reset-btn{
    background:none;border:1px solid var(--line);color:var(--dim);
    padding:5px 10px;border-radius:6px;cursor:pointer;font-size:.8em;font-family:inherit;
  }
  .reset-btn:hover{color:var(--text);border-color:var(--accent);}
  section{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    margin-bottom:16px; overflow:hidden;
  }
  .sec-head{
    padding:13px 16px; cursor:pointer; display:flex; justify-content:space-between;
    align-items:center; background:var(--panel2); user-select:none;
  }
  .sec-head:hover{background:#251c33;}
  .sec-title{font-size:1.12em;color:var(--accent);letter-spacing:.5px;}
  .sec-count{color:var(--dim);font-size:.85em;white-space:nowrap;margin-left:10px;}
  .sec-right{display:flex;align-items:center;gap:8px;}
  .sec-chevron{display:inline-block;color:var(--dim);transition:transform .2s;font-size:.9em;}
  .sec-chevron.open{transform:rotate(90deg);}
  .sec-body{padding:6px 16px 14px;}
  .sec-body.collapsed{display:none;}
  .note{color:var(--dim);font-size:.85em;margin:2px 0 10px;line-height:1.4;}
  .group-title{
    color:var(--gold); font-size:.95em; margin:14px 0 6px; padding-bottom:3px;
    border-bottom:1px dashed var(--line);
  }
  .item{
    display:flex; align-items:flex-start; gap:10px; padding:6px 4px;
    border-radius:6px; cursor:pointer;
  }
  .item:hover{background:rgba(255,255,255,0.03);}
  .item input{margin-top:3px; accent-color:var(--accent); width:16px;height:16px; cursor:pointer;}
  .item .label{flex:1;}
  .item .name{font-weight:bold;}
  .item .desc{color:var(--dim); font-size:.85em; display:block; margin-top:1px;}
  .item.checked .name{color:var(--green); text-decoration:line-through; text-decoration-color:rgba(127,217,155,0.5);}
  .item.checked .desc{opacity:.55;}
  .counter-row{display:flex;align-items:center;gap:10px;padding:8px 4px;}
  .counter-row .name{font-weight:bold;flex:0 0 auto;min-width:200px;}
  .counter-row input[type=number]{
    width:64px; background:#241c30; border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:4px 6px; font-family:inherit;
  }
  .counter-row .of{color:var(--dim);}
  .leveled-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex-wrap:wrap; cursor:default;
  }
  .leveled-row .label{flex:1; min-width:140px;}
  .lvl-group{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .lvl-box{
    display:flex; align-items:center; gap:4px; cursor:pointer;
    background:#241c30; border:1px solid var(--line); border-radius:6px;
    padding:3px 8px; font-size:.78em; color:var(--dim);
  }
  .lvl-box:hover{border-color:var(--accent); color:var(--text);}
  .lvl-box input{accent-color:var(--accent); width:14px;height:14px; cursor:pointer; margin:0;}
  .lvl-box:has(input:checked){border-color:var(--green); color:var(--green); background:rgba(127,217,155,0.08);}
  footer{text-align:center;color:var(--dim);font-size:.8em;margin-top:30px;line-height:1.6;}

  @media (max-width: 480px){
    body{ padding:14px 8px 40px; }
    h1{ font-size:1.5em; letter-spacing:1px; }
    .subtitle{ font-size:.85em; }
    .total-bar{ padding:12px; }
    .total-row .pct{ font-size:1.3em; }
    .sec-head{ padding:11px 12px; }
    .sec-title{ font-size:1em; }
    .sec-body{ padding:4px 10px 10px; }
    .item{ padding:8px 2px; }
    .leveled-row{ flex-direction:column; align-items:stretch; gap:6px; }
    .leveled-row .label{ min-width:0; }
    .lvl-group{ justify-content:flex-start; }
    .lvl-box{ padding:5px 9px; font-size:.82em; }
    .note{ font-size:.8em; }
  }
</style>
</head>

    title:"Crossroads Renewal Project, Training Ground",
    type:"check",
    note:"Decorations purchased from Dora for the Training Ground.",
    groups:[
      {name:"Decorations", items:[
        ["Arcana, Close Aspect"],
        ["Arcana, Distant Aspect"],
        ["Arcana, Familiar"],
        ["Arcana, Fate-bound"],
        ["Arcana, Fearsome"],
        ["Arcana, Hidden Aspect"],
        ["Arcana, Nocturnal"],
        ["Arcana, Unseen"],
        ["Birdhouse, Luxurious"],
        ["Charm, Amphibian"],
        ["Charm, Avian"],
        ["Charm, Canine"],
        ["Charm, Feline"],
        ["Charm, Musteline"],
        ["Chthonic Chid, Artemis"],
        ["Chthonic Chid, Charon"],
        ["Chthonic Chid, Dora"],
        ["Chthonic Chid, Eris"],
        ["Chthonic Chid, Hecate"],
        ["Chthonic Chid, Hypnos"],
        ["Chthonic Chid, Icarus"],
        ["Chthonic Chid, Moros"],
        ["Chthonic Chid, Nemesis"],
        ["Chthonic Chid, Odysseus"],
        ["Chthonic Chid, Schelemeus"],
        ["Chthonic Chid, Selene"],
        ["Dais, Infernal"],
        ["Dais, Morbid"],
        ["Dais, Stone"],
        ["Effigies, Immortal"],
        ["Effigies, Straw"],
        ["Effigies, Titan"],
        ["Post, Scratching"],
        ["Statue, Abandoned"],
      ]},
    ]
  },
];;

const state = { checked:{}, counters:{} };
const STORAGE_KEY = "hades2-checklist-progress";

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }
function itemId(secId, groupIdx, itemIdx, name){ return secId+"__"+slug(name); }
function levelId(secId, groupIdx, itemIdx, lvl, name){ return secId+"__"+slug(name)+"__L"+lvl; }
function levelsFor(sec){ return sec.type === "leveled" ? (sec.levels || 3) : 1; }
function itemLevels(sec, it){
  if(it[2] !== undefined) return it[2]; // per-item override: 0 = simple checkbox, N = N rank boxes
  return sec.type === "leveled" ? (sec.levels || 3) : 0;
}

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state.checked = parsed.checked || {};
      state.counters = parsed.counters || {};
    }
  }catch(e){ /* no saved state yet */ }
}

async function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error("save failed", e); }
}

function render(){
  const container = document.getElementById("sections");
  container.innerHTML = "";
  let grandTotal = 0, grandChecked = 0;

  DATA.forEach(sec => {
    let secTotal = 0, secChecked = 0;
    const secEl = document.createElement("section");

    const head = document.createElement("div");
    head.className = "sec-head";
    head.innerHTML = `<span class="sec-title">${sec.title}</span><span class="sec-right"><span class="sec-count" id="cnt-${sec.id}"></span><span class="sec-chevron">▸</span></span>`;
    head.onclick = () => {
      body.classList.toggle("collapsed");
      head.querySelector(".sec-chevron").classList.toggle("open", !body.classList.contains("collapsed"));
    };
    secEl.appendChild(head);

    const body = document.createElement("div");
    body.className = "sec-body collapsed";

    if(sec.note){
      const n = document.createElement("div");
      n.className = "note";
      n.textContent = sec.note;
      body.appendChild(n);
    }

    sec.groups.forEach((g, gi) => {
      const gt = document.createElement("div");
      gt.className = "group-title";
      gt.textContent = g.name;
      body.appendChild(gt);

      g.items.forEach((it, ii) => {
        const [name, desc] = it;
        const nLevels = itemLevels(sec, it);

        if(nLevels > 0){
          const labels = (sec.levelLabels && sec.levelLabels.length >= nLevels)
            ? sec.levelLabels
            : Array.from({length:nLevels}, (_,i)=>"Rank "+(i+1));
          const row = document.createElement("div");
          row.className = "item leveled-row";
          let allChecked = true;
          const boxesHtml = [];
          for(let lvl=1; lvl<=nLevels; lvl++){
            const lid = levelId(sec.id, gi, ii, lvl, name);
            secTotal++; grandTotal++;
            const isChecked = !!state.checked[lid];
            if(isChecked){ secChecked++; grandChecked++; } else { allChecked = false; }
            boxesHtml.push(`<label class="lvl-box" data-lid="${lid}" data-lvl="${lvl}">
              <input type="checkbox" ${isChecked?"checked":""}><span class="lvl-tag">${labels[lvl-1]}</span>
            </label>`);
          }
          row.classList.toggle("checked", allChecked);
          row.innerHTML = `<span class="label"><span class="name">${name}</span>${desc?`<span class="desc">${desc}</span>`:""}</span>
            <span class="lvl-group">${boxesHtml.join("")}</span>`;
          const boxEls = Array.from(row.querySelectorAll(".lvl-box"));
          boxEls.forEach(box => {
            const lvl = parseInt(box.getAttribute("data-lvl"), 10);
            const toggle = (e) => {
              e.stopPropagation();
              const lid = levelId(sec.id, gi, ii, lvl, name);
              const nowChecked = !state.checked[lid];
              if(nowChecked){
                // checking a rank auto-checks every rank below it
                for(let l=1; l<=lvl; l++){
                  state.checked[levelId(sec.id, gi, ii, l, name)] = true;
                }
              } else {
                // unchecking a rank auto-unchecks every rank above it
                for(let l=lvl; l<=nLevels; l++){
                  state.checked[levelId(sec.id, gi, ii, l, name)] = false;
                }
              }
              // sync all checkboxes in this row to reflect the cascade
              boxEls.forEach(b => {
                const bl = parseInt(b.getAttribute("data-lvl"), 10);
                b.querySelector("input").checked = !!state.checked[levelId(sec.id, gi, ii, bl, name)];
              });
              let rowAllChecked = true;
              for(let l=1; l<=nLevels; l++){
                if(!state.checked[levelId(sec.id, gi, ii, l, name)]){ rowAllChecked = false; break; }
              }
              row.classList.toggle("checked", rowAllChecked);
              saveState();
              updateCounts();
            };
            box.onclick = toggle;
          });
          body.appendChild(row);
          return;
        }

        const id = itemId(sec.id, gi, ii, name);
        secTotal++; grandTotal++;
        const isChecked = !!state.checked[id];
        if(isChecked){ secChecked++; grandChecked++; }

        const row = document.createElement("div");
        row.className = "item" + (isChecked ? " checked" : "");
        row.innerHTML = `<input type="checkbox" ${isChecked?"checked":""}>
          <span class="label"><span class="name">${name}</span>${desc?`<span class="desc">${desc}</span>`:""}</span>`;
        const cb = row.querySelector("input");
        const toggle = () => {
          state.checked[id] = !state.checked[id];
          cb.checked = state.checked[id];
          row.classList.toggle("checked", state.checked[id]);
          saveState();
          updateCounts();
        };
        row.onclick = (e) => { if(e.target !== cb) toggle(); };
        cb.onclick = (e) => { e.stopPropagation(); toggle(); };
        body.appendChild(row);
      });
    });

    secEl.appendChild(body);
    container.appendChild(secEl);
    head.querySelector(".sec-count").textContent = `${secChecked}/${secTotal}`;
  });

  document.getElementById("totalCount").textContent = `${grandChecked} / ${grandTotal} tracked items`;
  const pct = grandTotal ? (grandChecked/grandTotal)*100 : 0;
  document.getElementById("totalPct").textContent = pct.toFixed(2) + "%";
  document.getElementById("totalBar").style.width = pct + "%";
}

function updateCounts(){
  DATA.forEach(sec => {
    let total = 0, checkedCount = 0;
    sec.groups.forEach((g, gi) => {
      g.items.forEach((it, ii) => {
        const n = itemLevels(sec, it);
        const name = it[0];
        if(n > 0){
          for(let lvl=1; lvl<=n; lvl++){
            total++;
            if(state.checked[levelId(sec.id, gi, ii, lvl, name)]) checkedCount++;
          }
        } else {
          total++;
          if(state.checked[itemId(sec.id, gi, ii, name)]) checkedCount++;
        }
      });
    });
    const el = document.getElementById("cnt-"+sec.id);
    if(el) el.textContent = `${checkedCount}/${total}`;
  });
  let grandTotal = 0, grandChecked = 0;
  DATA.forEach(sec => sec.groups.forEach((g, gi) => g.items.forEach((it, ii) => {
    const n = itemLevels(sec, it);
    const name = it[0];
    if(n > 0){
      for(let lvl=1; lvl<=n; lvl++){
        grandTotal++;
        if(state.checked[levelId(sec.id, gi, ii, lvl, name)]) grandChecked++;
      }
    } else {
      grandTotal++;
      if(state.checked[itemId(sec.id, gi, ii, name)]) grandChecked++;
    }
  })));
  document.getElementById("totalCount").textContent = `${grandChecked} / ${grandTotal} tracked items`;
  const pct = grandTotal ? (grandChecked/grandTotal)*100 : 0;
  document.getElementById("totalPct").textContent = pct.toFixed(2) + "%";
  document.getElementById("totalBar").style.width = pct + "%";
}

const resetBtn = document.getElementById("resetBtn");
let resetArmed = false;
let resetTimer = null;
resetBtn.onclick = async () => {
  if(!resetArmed){
    resetArmed = true;
    resetBtn.textContent = "Click again to confirm reset";
    resetBtn.style.borderColor = "#e05a5a";
    resetBtn.style.color = "#ff8a8a";
    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => {
      resetArmed = false;
      resetBtn.textContent = "Reset All Progress";
      resetBtn.style.borderColor = "";
      resetBtn.style.color = "";
    }, 4000);
    return;
  }
  clearTimeout(resetTimer);
  resetArmed = false;
  resetBtn.textContent = "Reset All Progress";
  resetBtn.style.borderColor = "";
  resetBtn.style.color = "";
  state.checked = {};
  state.counters = {};
  await saveState();
  render();
};

(async () => {
  await loadState();
  render();
})();
</script>
</body>
</html>
